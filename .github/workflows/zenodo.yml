name: Update eBook chapter list from Zenodo

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch community records
        run: |
          set -e
          mkdir -p data
          URL1="https://zenodo.org/api/communities/netgainebook/records?sort=newest&size=100"
          URL2="https://zenodo.org/api/records?communities=netgainebook&sort=newest&size=100"
          if ! curl -fsSL -H "Accept: application/json" "$URL1" -o /tmp/ebook.json; then
            curl -fsSL -H "Accept: application/json" "$URL2" -o /tmp/ebook.json
          fi
          jq '{fetched: (now | todate), hits: [.hits.hits[] | {id, doi: (.doi // .pids.doi.identifier // ""), title: .metadata.title, creators: [.metadata.creators[] | (.person_or_org.name // .name)], date: (.metadata.publication_date // .created), type: (.metadata.resource_type.title.en // .metadata.resource_type.title // .metadata.resource_type.type // ""), description: (.metadata.description // ""), link: (.links.self_html // "")}]}' /tmp/ebook.json > data/ebook.json
          jq '.hits | length' data/ebook.json
      - name: Commit if changed
        run: |
          git config user.name "zenodo-sync"
          git config user.email "noreply@netgain-dfa.org"
          git add data/ebook.json
          git diff --cached --quiet && echo "No change" || git commit -m "Update eBook chapter list from Zenodo" && git push
