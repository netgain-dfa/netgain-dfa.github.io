name: Update eBook chapter list from Zenodo

on:
  schedule:
    - cron: "23 19 * * 0"   # Sundays, 19:23 UTC (evening, UK time)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch community records
        shell: python
        run: |
          import json, urllib.request, urllib.error, datetime, os
          bases = [
            "https://zenodo.org/api/communities/netgainebook/records?sort=newest&size=25&page=",
            "https://zenodo.org/api/records?communities=netgainebook&sort=newest&size=25&page=",
          ]
          out = {"fetched": datetime.datetime.utcnow().isoformat() + "Z", "hits": [], "errors": []}
          def get(u):
            req = urllib.request.Request(u, headers={"Accept": "application/json", "User-Agent": "netgain-dfa.org sync"})
            with urllib.request.urlopen(req, timeout=60) as r:
              return json.loads(r.read().decode("utf-8", "replace"))
          hits = None
          for b in bases:
            try:
              hits, page = [], 1
              while True:
                data = get(b + str(page))
                batch = data.get("hits", {}).get("hits", [])
                hits.extend(batch)
                out["total"] = data.get("hits", {}).get("total")
                if len(batch) < 25 or page >= 20: break
                page += 1
              out["source"] = b
              break
            except urllib.error.HTTPError as e:
              hits = None
              out["errors"].append(f"{b} -> HTTP {e.code}: {e.read()[:300].decode('utf-8','replace')}")
            except Exception as e:
              hits = None
              out["errors"].append(f"{b} -> {type(e).__name__}: {e}")
          if hits is not None:
            for h in hits:
              m = h.get("metadata", {})
              rt = m.get("resource_type", {})
              title = rt.get("title")
              if isinstance(title, dict): title = title.get("en") or next(iter(title.values()), "")
              out["hits"].append({
                "id": h.get("id"),
                "doi": h.get("doi") or (h.get("pids", {}).get("doi", {}) or {}).get("identifier", ""),
                "title": m.get("title", ""),
                "creators": [(c.get("person_or_org", {}) or {}).get("name") or c.get("name", "") for c in m.get("creators", [])],
                "date": m.get("publication_date") or h.get("created", ""),
                "type": title or rt.get("type", ""),
                "description": m.get("description", ""),
                "link": (h.get("links", {}) or {}).get("self_html", ""),
              })
          os.makedirs("data", exist_ok=True)
          with open("data/ebook.json", "w") as f:
            json.dump(out, f, indent=1, ensure_ascii=False)
          print(json.dumps({k: v for k, v in out.items() if k != "hits"}, indent=1), "hits:", len(out["hits"]))
      - name: Commit if changed
        run: |
          git config user.name "zenodo-sync"
          git config user.email "noreply@netgain-dfa.org"
          git add data/ebook.json
          git diff --cached --quiet && echo "No change" || (git commit -m "Update eBook chapter list from Zenodo" && git push)
